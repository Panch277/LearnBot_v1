<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnBot Dashboard</title>
    <link rel="icon" type="image/png" href="/utn-logo.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/utn-logo.png" alt="UTN" class="brand__logo" />
        <h1>LearnBot</h1>
      </div>
      <div id="connection-badge" class="badge badge--connecting">connecting…</div>
    </header>

    <main class="layout">
      <section class="panel panel--3d">
        <h2>3D View</h2>
        <div class="viewer-wrap">
          <div id="robot-viewer"></div>
          <div class="viewer-tools" role="group" aria-label="3D view interaction mode">
            <button data-view-mode="orbit" class="viewer-tools__btn is-active" title="Orbit (drag to rotate)">⟲</button>
            <button data-view-mode="pan" class="viewer-tools__btn" title="Move (drag to pan)">✛</button>
            <button data-view-mode="pose" class="viewer-tools__btn" title="Set initial pose (press &amp; drag to aim)">📍</button>
            <button data-view-mode="goal" class="viewer-tools__btn" title="Send nav goal (press &amp; drag to aim)">🏁</button>
          </div>
        </div>
      </section>

      <section class="panel panel--camera">
        <h2>Camera</h2>
        <img id="camera-feed" alt="Robot camera feed" />
      </section>

      <section class="panel panel--teleop">
        <h2>Drive</h2>
        <div class="dpad">
          <button data-teleop-direction="forward" class="dpad__btn dpad__up">▲</button>
          <button data-teleop-direction="left" class="dpad__btn dpad__left">◀</button>
          <button data-teleop-direction="right" class="dpad__btn dpad__right">▶</button>
          <button data-teleop-direction="backward" class="dpad__btn dpad__down">▼</button>
        </div>
        <p class="hint">Arrow keys / WASD also work.</p>
      </section>

      <section class="panel panel--process">
        <h2>SLAM / Nav2</h2>
        <button data-process-toggle="slam" class="toggle-btn">Start SLAM</button>
        <p data-process-status="slam" class="hint"></p>
        <div class="map-save">
          <input id="map-save-name" type="text" class="text-input" placeholder="map name, e.g. living_room" />
          <button id="map-save-btn" class="toggle-btn">Save Map</button>
          <p id="map-save-status" class="hint"></p>
        </div>

        <hr class="panel-divider" />

        <div class="map-select-row">
          <select id="nav2-map-select" class="text-input" disabled>
            <option>Loading maps…</option>
          </select>
          <button id="nav2-map-refresh" class="icon-btn" title="Refresh map list">⟳</button>
        </div>
        <button data-process-toggle="nav2" class="toggle-btn">Start Nav2</button>
        <p data-process-status="nav2" class="hint"></p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
